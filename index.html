<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>○×問題アプリ（CSV取込・即採点・マーク“トグル”版）</title>
  <style>
    :root{
      --bg:#f7f7f8;
      --card:#fff;
      --ink:#111;
      --muted:#666;
      --accent:#2563eb;
      --ok:#10b981;
      --ng:#ef4444;
      --sel:#e5e7eb
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif
    }
    header{
      position:sticky;
      top:0;
      background:var(--card);
      border-bottom:1px solid #e5e7eb
    }
    header .bar{
      max-width:840px;
      margin:0 auto;
      padding:.8rem .9rem;
      display:flex;
      gap:.75rem;
      align-items:center
    }
    main{
      max-width:840px;
      margin:0 auto;
      padding:1rem .9rem 2rem
    }
    .card{
      background:var(--card);
      border:1px solid #e5e7eb;
      border-radius:14px;
      box-shadow:0 2px 10px rgba(0,0,0,.04)
    }
    .pad{padding:1rem}
    .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      padding:.25rem .6rem;
      border:1px solid #e5e7eb;
      border-radius:999px;
      background:#fff
    }
    .btn{
      appearance:none;
      border:1px solid #d1d5db;
      background:#fff;
      color:#111;
      padding:.6rem .9rem;
      border-radius:12px;
      font-weight:700;
      cursor:pointer
    }
    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff
    }
    .btn.choice{
      background:#fff;
      color:#111
    }
    .btn.choice.selected{
      background:var(--sel);
      color:#111
    }
    .btn.marked{
      background:var(--sel);
      color:#111
    }
    .qtext{
      font-size:1.1rem;
      white-space:pre-wrap; /* 改行を反映 */
    }
    .muted{color:var(--muted)}
    .result{font-weight:800}
    .result.ok{color:var(--ok)}
    .result.ng{color:var(--ng)}
    .progress{
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden
    }
    .progress>i{
      display:block;
      height:100%;
      background:var(--accent);
      width:0
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1 style="font-size:1.05rem;margin:0">○×問題アプリ（CSV取込・即採点）</h1>
      <div style="margin-left:auto" class="pill">
        総問題数: <b id="len">0</b>
      </div>
      <button id="btnStart" class="btn primary" disabled>読み込み中…</button>
    </div>
  </header>

  <main>
    <section id="setup" class="card pad">
      <div class="row">
        <label class="pill">
          <input type="checkbox" id="optShuffle"> シャッフル
        </label>
        <label class="pill">
          <input type="checkbox" id="optWrongOnly"> 間違えた問題のみ
        </label>
        <button class="btn" id="btnClear">履歴クリア</button>
      </div>
      <p class="muted" style="margin:.2rem 0 0">
        ○/× を押した瞬間に正誤と解説が表示されます。「間違えた扱いにする」はトグル（ON/OFF）です。
      </p>
    </section>

    <section id="quiz" class="card pad" style="display:none">
      <div class="row" style="gap:1rem;align-items:center">
        <div class="pill">問題 <b id="idx">1</b>/<b id="total">0</b></div>
        <div class="pill">正解 <b id="ok">0</b></div>
        <div class="pill">不正解 <b id="ng">0</b></div>
        <button class="btn" id="btnExit" style="margin-left:auto">終了</button>
      </div>
      <div class="progress"><i id="bar"></i></div>

      <div class="qtext" id="qtext" style="margin:.6rem 0 .4rem"></div>

      <div class="row" id="choices" style="justify-content:center;margin:.4rem 0 .2rem">
        <button class="btn choice" id="btnTrue">○ 正しい</button>
        <button class="btn choice" id="btnFalse">× 誤り</button>
      </div>

      <div class="result" id="result" style="display:none"></div>
      <div id="explainWrap" class="muted" style="display:none; margin-top:.5rem"></div>

      <div class="row" style="justify-content:space-between;margin-top:.6rem">
        <button class="btn" id="btnPrev">← 前</button>
        <div class="row" style="gap:.5rem">
          <button class="btn" id="btnMarkWrong">間違えた扱いにする</button>
          <button class="btn" id="btnNext">次 →</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ====== 0. CSV から DATA を作成する部分 ==========================
    const CSV_PATH = "問題_解説_DB - DB.csv"; // 同じフォルダに置く

    let DATA = []; // {id, text, answer(bool), explain} の配列にする

    function parseAnswer(raw){
      const s = (raw || "").trim();
      if (!s) return false;
      if (s === "○" || s === "◯") return true;
      if (s === "×" || s === "✕") return false;
      if (s === "1" || /^true$/i.test(s) || s.includes("正")) return true;
      if (s === "0" || /^false$/i.test(s) || s.includes("誤")) return false;
      return false;
    }

    // シンプル CSV パーサー（カンマ区切り & ダブルクォート対応）
    function parseCSV(text){
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for(let i=0;i<text.length;i++){
        const c = text[i];
        if (c === '"'){
          if (inQuotes && text[i+1] === '"'){ // "" → "
            field += '"';
            i++;
          }else{
            inQuotes = !inQuotes;
          }
        }else if (c === ',' && !inQuotes){
          row.push(field);
          field = "";
        }else if ((c === '\n' || c === '\r') && !inQuotes){
          if (c === '\r' && text[i+1] === '\n') i++; // CRLF
          row.push(field);
          field = "";
          // 空行でなければ追加
          if (row.some(v => (v || "").trim() !== "")) rows.push(row);
          row = [];
        }else{
          field += c;
        }
      }
      if (field.length || row.length){
        row.push(field);
        if (row.some(v => (v || "").trim() !== "")) rows.push(row);
      }
      return rows;
    }

    function csvToData(text){
      const rows = parseCSV(text);
      if (!rows.length) return [];
      const header = rows[0].map(s => (s || "").trim());

      const idxId      = header.findIndex(h => /id|番号/i.test(h));
      const idxText    = header.findIndex(h => /問題/.test(h));
      const idxAns     = header.findIndex(h => /正誤|正解/.test(h));
      const idxExplain = header.findIndex(h => /解説/.test(h));

      const data = [];
      for (let i=1;i<rows.length;i++){
        const r = rows[i];
        if (!r || !r.length) continue;

        const idStr = idxId >= 0 ? (r[idxId] || "").trim() : String(i);
        const id    = Number(idStr) || i;

        const textRaw    = idxText    >= 0 ? (r[idxText]    || "") : "";
        const explainRaw = idxExplain >= 0 ? (r[idxExplain] || "") : "";
        const ansRaw     = idxAns     >= 0 ? (r[idxAns]     || "") : "";

        data.push({
          id,
          // 「\n」という文字列を実際の改行に変換
          text:    textRaw.replace(/\\n/g, '\n'),
          answer:  parseAnswer(ansRaw),
          explain: explainRaw.replace(/\\n/g, '\n')
        });
      }
      return data;
    }

    async function loadCSV(){
      try{
        const res = await fetch(CSV_PATH);
        if (!res.ok) throw new Error("CSV を読み込めませんでした: " + res.status);
        const text = await res.text();
        DATA = csvToData(text);
        if (!DATA.length){
          alert("CSV から問題データを読み込めませんでした。ヘッダー行（問題・正誤・解説など）を確認してください。");
        }
      }catch(e){
        console.error(e);
        alert("問題データの読み込みに失敗しました。\nindex.html と CSV が同じフォルダにあるか、ファイル名を確認してください。");
      }
    }

    // ====== 1. 元のアプリ本体ロジック（DATA をそのまま利用） ======
    const WRONG_KEY  = "mxquiz_wrong_v1";
    const RESULT_KEY = "mxquiz_result_v1";

    const $ = (id)=>document.getElementById(id);
    const $setup   = $('setup');
    const $quiz    = $('quiz');
    const $btnStart= $('btnStart');
    const $btnExit = $('btnExit');
    const $optShuffle   = $('optShuffle');
    const $optWrongOnly = $('optWrongOnly');
    const $btnClear     = $('btnClear');
    const $len   = $('len');
    const $idx   = $('idx');
    const $total = $('total');
    const $ok    = $('ok');
    const $ng    = $('ng');
    const $bar   = $('bar');
    const $qtext = $('qtext');
    const $btnTrue  = $('btnTrue');
    const $btnFalse = $('btnFalse');
    const $result      = $('result');
    const $explainWrap = $('explainWrap');
    const $btnPrev     = $('btnPrev');
    const $btnNext     = $('btnNext');
    const $btnMarkWrong= $('btnMarkWrong');

    let wrongSet = new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || "[]"));
    let quiz = { order: [], i: 0, picked: null, ok: 0, ng: 0, locked: false };

    function updateHeaderCounts(){
      $len.textContent = DATA.length;
    }

    function startQuiz(){
      if (!DATA.length){
        alert("問題データがまだ読み込まれていません。CSV の読み込みに失敗している可能性があります。");
        return;
      }
      let pool = DATA.slice();
      if ($optWrongOnly.checked){
        pool = pool.filter(x => wrongSet.has(x.id));
        if (!pool.length){
          alert('間違えた問題がありません');
          return;
        }
      }
      if (!pool.length){
        alert('問題データが設定されていません');
        return;
      }
      if ($optShuffle.checked){
        for(let i=pool.length-1;i>0;i--){
          const j = (Math.random()*(i+1))|0;
          [pool[i],pool[j]] = [pool[j],pool[i]];
        }
      }
      quiz = {
        order: pool.map(x=>x.id),
        i:0,
        picked:null,
        ok:0,
        ng:0,
        locked:false
      };
      $setup.style.display='none';
      $quiz.style.display='block';
      render();
    }

    function exitQuiz(){
      $quiz.style.display='none';
      $setup.style.display='block';
    }

    function cur(){
      const id = quiz.order[quiz.i];
      return DATA.find(x=>x.id === id);
    }

    function setSelected(which){
      $btnTrue.classList.toggle('selected', which === 'true');
      $btnFalse.classList.toggle('selected', which === 'false');
    }

    function render(){
      const item = cur();
      $idx.textContent   = quiz.i + 1;
      $total.textContent = quiz.order.length;
      $ok.textContent    = quiz.ok;
      $ng.textContent    = quiz.ng;
      $bar.style.width   =
        Math.round((quiz.i / Math.max(1, quiz.order.length)) * 100) + '%';

      $qtext.textContent = item ? item.text : '';

      setSelected(null);
      $result.style.display      = 'none';
      $explainWrap.style.display = 'none';
      $explainWrap.textContent   = item && item.explain ? item.explain : '';
      $btnTrue.disabled  = false;
      $btnFalse.disabled = false;

      $btnMarkWrong.classList.toggle('marked', item ? wrongSet.has(item.id) : false);

      quiz.picked = null;
      quiz.locked = false;
    }

    function grade(pickedBool){
      if (quiz.locked) return;
      const item = cur();
      if (!item) return;

      quiz.picked = pickedBool;
      const ok = pickedBool === item.answer;

      if (ok) quiz.ok++;
      else{
        quiz.ng++;
        wrongSet.add(item.id);
        persistWrong();
      }
      persistResult();

      $result.textContent = ok ? '正解！' : '不正解';
      $result.className   = 'result ' + (ok ? 'ok' : 'ng');
      $result.style.display = 'block';
      $explainWrap.style.display = 'block';

      setSelected(pickedBool ? 'true' : 'false');
      $btnTrue.disabled  = true;
      $btnFalse.disabled = true;
      quiz.locked = true;

      $btnMarkWrong.classList.toggle('marked', wrongSet.has(item.id));
    }

    function persistWrong(){
      localStorage.setItem(WRONG_KEY, JSON.stringify(Array.from(wrongSet)));
    }
    function persistResult(){
      localStorage.setItem(RESULT_KEY, JSON.stringify({
        ts:Date.now(), ok:quiz.ok, ng:quiz.ng
      }));
    }

    $btnMarkWrong.onclick = ()=>{
      const item = cur();
      if (!item) return;
      if (wrongSet.has(item.id)){
        wrongSet.delete(item.id);
      }else{
        wrongSet.add(item.id);
      }
      persistWrong();
      $btnMarkWrong.classList.toggle('marked', wrongSet.has(item.id));
    };

    $btnStart.onclick = startQuiz;
    $btnExit.onclick  = exitQuiz;
    $btnPrev.onclick  = ()=>{
      if (quiz.i > 0){
        quiz.i--;
        render();
      }
    };
    $btnNext.onclick  = ()=>{
      if (quiz.i < quiz.order.length - 1){
        quiz.i++;
        render();
      }
    };
    $btnTrue.onclick  = ()=> grade(true);
    $btnFalse.onclick = ()=> grade(false);
    $btnClear.onclick = ()=>{
      if (!confirm("間違い履歴と前回結果を削除します。よろしいですか？")) return;
      wrongSet.clear();
      localStorage.removeItem(WRONG_KEY);
      localStorage.removeItem(RESULT_KEY);
      alert("履歴をクリアしました。");
    };

    // 初期化：CSV を読み込み、問題数を表示して Start を有効化
    (async ()=>{
      await loadCSV();
      updateHeaderCounts();
      if (DATA.length){
        $btnStart.disabled = false;
        $btnStart.textContent = "開始";
      }else{
        $btnStart.disabled = true;
        $btnStart.textContent = "問題データなし";
      }
    })();
  </script>
</body>
</html>
