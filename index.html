<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>○×問題アプリ（問題_解説_DB 内蔵版）</title>
  <style>
    :root{
      --bg:#f7f7f8;
      --card:#fff;
      --ink:#111;
      --muted:#666;
      --accent:#2563eb;
      --ok:#10b981;
      --ng:#ef4444;
      --sel:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
    }
    header{
      position:sticky;
      top:0;
      background:var(--card);
      border-bottom:1px solid #e5e7eb;
      z-index:10;
    }
    header .bar{
      max-width:840px;
      margin:0 auto;
      padding:.8rem .9rem;
      display:flex;
      gap:.75rem;
      align-items:center;
    }
    main{
      max-width:840px;
      margin:0 auto;
      padding:1rem .9rem 2rem;
    }
    .card{
      background:var(--card);
      border:1px solid #e5e7eb;
      border-radius:14px;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .pad{padding:1rem}
    .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      padding:.25rem .6rem;
      border:1px solid #e5e7eb;
      border-radius:999px;
      background:#fff;
      font-size:.87rem;
    }
    .pill select{
      border:none;
      background:transparent;
      font-size:.87rem;
      padding:0 .25rem;
      outline:none;
    }
    .btn{
      appearance:none;
      border:1px solid #d1d5db;
      background:#fff;
      color:#111;
      padding:.6rem .9rem;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      font-size:.9rem;
    }
    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }
    .btn.choice{
      min-width:7rem;
      text-align:center;
    }
    .btn.choice.selected{
      background:var(--sel);
      color:#111;
    }
    .btn.marked{
      background:var(--sel);
      color:#111;
    }
    .qtext{
      font-size:1.1rem;
      white-space:pre-wrap;
    }
    .muted{color:var(--muted);font-size:.88rem}
    .result{font-weight:800;margin-top:.4rem}
    .result.ok{color:var(--ok)}
    .result.ng{color:var(--ng)}
    .progress{
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin:.6rem 0 .4rem;
    }
    .progress>i{
      display:block;
      height:100%;
      background:var(--accent);
      width:0;
      transition:width .2s ease-out;
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1 style="font-size:1.05rem;margin:0">○×問題アプリ（問題_解説_DB 内蔵）</h1>
      <div style="margin-left:auto" class="pill">
        総問題数: <b id="len">0</b>
      </div>
      <button id="btnStart" class="btn primary">開始</button>
    </div>
  </header>

  <main>
    <section id="setup" class="card pad">
      <div class="row">
        <label class="pill">
          範囲
          <select id="rangeSelect">
            <!-- CSV 読み込み後に 1〜50, 51〜100 ... を自動生成 -->
          </select>
        </label>
        <label class="pill">
          <input type="checkbox" id="optShuffle">
          シャッフル
        </label>
        <label class="pill">
          <input type="checkbox" id="optWrongOnly">
          間違えた問題のみ
        </label>
        <button class="btn" id="btnClear">履歴クリア</button>
      </div>
      <p class="muted" style="margin:.4rem 0 0">
        ・開始時に 50問単位の範囲を選べます（例: 1〜50問, 51〜100問 ...）。<br>
        ・「問題ジャンプ」で、その範囲内の任意の問題に直接飛べます。<br>
        ・○/× を押した瞬間に正誤と解説が表示されます。終了→再開始すると、その回の選択状態はリセットされます（復習用履歴は保持）。
      </p>
    </section>

    <section id="quiz" class="card pad" style="display:none">
      <div class="row" style="gap:1rem;align-items:center">
        <div class="pill">問題 <b id="idx">1</b>/<b id="total">0</b></div>
        <div class="pill">正解 <b id="ok">0</b></div>
        <div class="pill">不正解 <b id="ng">0</b></div>
        <div class="pill" id="currentRangeLabel">範囲: -</div>
        <button class="btn" id="btnExit" style="margin-left:auto">終了</button>
      </div>

      <div class="progress"><i id="bar"></i></div>

      <div class="row" style="margin:.2rem 0 .4rem">
        <label class="pill">
          問題ジャンプ
          <select id="jumpSelect">
            <!-- 範囲内の問題番号（No.x）を自動生成 -->
          </select>
        </label>
      </div>

      <div class="qtext" id="qtext" style="margin:.4rem 0 .4rem"></div>

      <div class="row" id="choices" style="justify-content:center;margin:.4rem 0 .2rem">
        <button class="btn choice" id="btnTrue">○ 正しい</button>
        <button class="btn choice" id="btnFalse">× 誤り</button>
      </div>

      <div class="result" id="result" style="display:none"></div>
      <div id="explainWrap" class="muted" style="display:none;margin-top:.5rem;white-space:pre-wrap"></div>

      <div class="row" style="justify-content:space-between;margin-top:.6rem">
        <button class="btn" id="btnPrev">← 前</button>
        <div class="row" style="gap:.5rem">
          <button class="btn" id="btnMarkWrong">間違えた扱いにする</button>
          <button class="btn" id="btnNext">次 →</button>
        </div>
      </div>
    </section>
  </main>

    const CHUNK_SIZE = 50;  // 50問ごとに区切る

    // ---------------------------------------
    // base64 → UTF-8 文字列
    // ---------------------------------------
    function b64ToUtf8(b64){
      if(!b64 || b64 === "PASTE_BASE64_OF_問題_解説_DB.csv_HERE"){
        throw new Error("CSV_BASE64 が設定されていません。Pythonで生成した文字列を貼り付けてください。");
      }
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      const dec = new TextDecoder("utf-8");
      return dec.decode(bytes);
    }

    // ---------------------------------------
    // シンプルな CSV パーサ
    // ・ダブルクオート内のカンマ / 改行対応
    // ・"" でのエスケープ対応
    // ---------------------------------------
    function parseCsv(text){
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;
      const len = text.length;

      for(let i=0;i<len;i++){
        const c = text[i];

        if(c === '"'){
          if(inQuotes && i+1 < len && text[i+1] === '"'){
            field += '"';
            i++;
          }else{
            inQuotes = !inQuotes;
          }
        }else if(c === "," && !inQuotes){
          row.push(field);
          field = "";
        }else if((c === "\n" || c === "\r") && !inQuotes){
          if(c === "\r" && i+1 < len && text[i+1] === "\n") i++;
          row.push(field);
          field = "";
          if(row.length && !(row.length === 1 && row[0] === "")){
            rows.push(row);
          }
          row = [];
        }else{
          field += c;
        }
      }

      if(field.length > 0 || row.length){
        row.push(field);
        rows.push(row);
      }

      return rows;
    }

    // ---------------------------------------
    // CSV テキスト → オブジェクト配列
    // ヘッダー: 問題, 正誤, 解説
    // ---------------------------------------
    function csvToObjects(csvText){
      const rows = parseCsv(csvText);
      if(!rows.length) return [];
      const header = rows[0].map(h => h.trim());
      const dataRows = rows.slice(1);

      return dataRows
        .filter(r => r.some(cell => cell && cell.trim() !== ""))
        .map(r => {
          const obj = {};
          for(let i=0;i<header.length;i++){
            const key = header[i] || ("col" + i);
            obj[key] = (i < r.length ? r[i] : "").trim();
          }
          return obj;
        });
    }

    // ---------------------------------------
    // 問題データ
    // { id, text, answer, explain }
    // ---------------------------------------
    let DATA = [];

    // UI 要素
    const $ = sel => document.querySelector(sel);
    const $btnStart = $('#btnStart');
    const $btnExit = $('#btnExit');
    const $setup = $('#setup');
    const $quiz = $('#quiz');
    const $idx = $('#idx');
    const $total = $('#total');
    const $ok = $('#ok');
    const $ng = $('#ng');
    const $bar = $('#bar');
    const $qtext = $('#qtext');
    const $result = $('#result');
    const $explainWrap = $('#explainWrap');
    const $btnTrue = $('#btnTrue');
    const $btnFalse = $('#btnFalse');
    const $btnPrev = $('#btnPrev');
    const $btnNext = $('#btnNext');
    const $btnMarkWrong = $('#btnMarkWrong');
    const $optShuffle = $('#optShuffle');
    const $optWrongOnly = $('#optWrongOnly');
    const $btnClear = $('#btnClear');
    const $len = $('#len');
    const $rangeSelect = $('#rangeSelect');
    const $jumpSelect = $('#jumpSelect');
    const $currentRangeLabel = $('#currentRangeLabel');

    // 状態
    let order = [];               // 出題順（id の配列）
    let cursor = 0;
    let scoreOk = 0;
    let scoreNg = 0;

    // 永続化する履歴（復習用）
    let historyAnswered = {};     // { [id]: { choice: bool, isCorrect: bool } }
    let wrongMarked = new Set();  // 「間違えた扱い」用（手動）

    // 今回のクイズセッションだけで使う回答状況
    let sessionAnswered = {};     // { [id]: { choice: bool, isCorrect: bool } }

    // 選択されている範囲（1-based の id）
    let rangeStartId = 1;
    let rangeEndId   = 1;

    const KEY_HISTORY = 'maruBatsuHistoryV1';
    const KEY_WRONG   = 'maruBatsuWrongV1';

    function loadHistory(){
      try{
        const h = JSON.parse(localStorage.getItem(KEY_HISTORY) || '{}');
        historyAnswered = h || {};
      }catch(e){
        historyAnswered = {};
      }
      try{
        const w = JSON.parse(localStorage.getItem(KEY_WRONG) || '[]');
        wrongMarked = new Set(w || []);
      }catch(e){
        wrongMarked = new Set();
      }
    }

    function saveHistory(){
      localStorage.setItem(KEY_HISTORY, JSON.stringify(historyAnswered));
      localStorage.setItem(KEY_WRONG, JSON.stringify([...wrongMarked]));
    }

    // スコアは「今回のセッションでの回答」だけで計算
    function resetScore(){
      scoreOk = 0;
      scoreNg = 0;
      for(const id of order){
        const rec = sessionAnswered[id];
        if(!rec) continue;
        if(rec.isCorrect) scoreOk++;
        else scoreNg++;
      }
      $ok.textContent = scoreOk;
      $ng.textContent = scoreNg;
    }

    // 範囲セレクトの候補生成（1〜50, 51〜100 ...）
    function initRangeOptions(){
      if(!DATA.length || !$rangeSelect) return;
      const n = DATA.length;
      const chunkCount = Math.ceil(n / CHUNK_SIZE);
      $rangeSelect.innerHTML = "";
      for(let i=0;i<chunkCount;i++){
        const start = i * CHUNK_SIZE + 1;
        const end = Math.min((i+1) * CHUNK_SIZE, n);
        const opt = document.createElement('option');
        opt.value = `${start}-${end}`;
        opt.textContent = `${start}〜${end}問`;
        if(i === 0) opt.selected = true;
        $rangeSelect.appendChild(opt);
      }
      // 初期値を更新
      const first = $rangeSelect.value.split("-");
      rangeStartId = parseInt(first[0] || "1", 10);
      rangeEndId   = parseInt(first[1] || String(n), 10);
      updateCurrentRangeLabel();
    }

    function updateCurrentRangeLabel(){
      if(!$currentRangeLabel) return;
      $currentRangeLabel.textContent = `範囲: ${rangeStartId}〜${rangeEndId}問`;
    }

    // ジャンプセレクトの候補生成（現在の order に基づく）
    function buildJumpOptions(){
      if(!$jumpSelect){
        return;
      }
      $jumpSelect.innerHTML = "";
      if(!order.length){
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "-";
        $jumpSelect.appendChild(opt);
        return;
      }
      order.forEach((id, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = `No.${id}`;
        $jumpSelect.appendChild(opt);
      });
      $jumpSelect.value = "0";
    }

    function buildOrder(wrongOnly){
      const ids = DATA.map((q,idx) => q.id ?? (idx+1));

      // 範囲でフィルタ
      let ranged = ids.filter(id => id >= rangeStartId && id <= rangeEndId);
      if(ranged.length === 0){
        // 念のため、空になってしまったら全体にフォールバック
        ranged = ids;
      }

      let filtered = ranged;

      if(wrongOnly){
        filtered = ranged.filter(id =>
          wrongMarked.has(id) ||
          (historyAnswered[id] && !historyAnswered[id].isCorrect)
        );
        // 「間違えた問題のみ」で 0 件なら、その範囲の全問題に戻す
        if(filtered.length === 0){
          filtered = ranged;
        }
      }

      if($optShuffle.checked){
        for(let i=filtered.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
        }
      }

      order = filtered;
      cursor = 0;
      $total.textContent = order.length;
      $len.textContent = DATA.length;
      resetScore();
      updateProgress();
      buildJumpOptions();
    }

    function updateProgress(){
      if(order.length === 0){
        $bar.style.width = '0%';
        return;
      }
      const pct = (cursor / order.length) * 100;
      $bar.style.width = pct + '%';
    }

    function currentItem(){
      const id = order[cursor];
      return DATA.find(q => q.id === id);
    }

    function render(){
      const item = currentItem();
      if(!item) return;

      $idx.textContent = cursor + 1;
      $qtext.textContent = item.text;
      $result.style.display = 'none';
      $explainWrap.style.display = 'none';
      $result.textContent = '';
      $result.className = 'result';

      $btnTrue.classList.remove('selected');
      $btnFalse.classList.remove('selected');
      $btnMarkWrong.classList.toggle('marked', wrongMarked.has(item.id));

      // 今回のセッションでの回答のみ反映
      const rec = sessionAnswered[item.id];
      if(rec){
        if(rec.choice === true)  $btnTrue.classList.add('selected');
        if(rec.choice === false) $btnFalse.classList.add('selected');
        showResult(rec.isCorrect, item);
      }
      updateProgress();

      // ジャンプセレクトの選択状態も同期
      if($jumpSelect && order.length){
        $jumpSelect.value = String(cursor);
      }
    }

    function showResult(isCorrect, item){
      $result.style.display = 'block';
      $explainWrap.style.display = 'block';
      $result.textContent = isCorrect ? '正解！' : '不正解…';
      $result.className = 'result ' + (isCorrect ? 'ok' : 'ng');
      $explainWrap.textContent = item.explain || '';
    }

    function grade(choice){
      const item = currentItem();
      if(!item) return;

      const isCorrect = (choice === item.answer);

      // 今回セッション用
      sessionAnswered[item.id] = { choice, isCorrect };

      // 復習用の永続履歴（過去分も含めて更新）
      historyAnswered[item.id] = { choice, isCorrect };
      saveHistory();

      resetScore();

      $btnTrue.classList.remove('selected');
      $btnFalse.classList.remove('selected');
      if(choice === true)  $btnTrue.classList.add('selected');
      if(choice === false) $btnFalse.classList.add('selected');

      showResult(isCorrect, item);
    }

    function next(){
      if(cursor < order.length - 1){
        cursor++;
        render();
      }
    }
    function prev(){
      if(cursor > 0){
        cursor--;
        render();
      }
    }

    // ---------------------------------------
    // CSV データ読み込み & DATA 構築
    // ---------------------------------------
    function initDataFromCsv(){
      try{
        const csvText = b64ToUtf8(CSV_BASE64);
        const rows = csvToObjects(csvText);

        // ヘッダー: 問題, 正誤, 解説 を前提
        DATA = rows.map((r, idx) => {
          const q = r["問題"] ?? r["question"] ?? "";
          const a = r["正誤"] ?? r["answer"] ?? "";
          const e = r["解説"] ?? r["explain"] ?? "";
          return {
            id: idx + 1,
            text: q,
            answer: (a === "○" || a === "true" || a === "1"),
            explain: e
          };
        }).filter(x => x.text && x.text.trim() !== "");

        if(!DATA.length){
          throw new Error("CSV から有効な問題データを読み込めませんでした。ヘッダー行が「問題,正誤,解説」になっているか確認してください。");
        }
        $len.textContent = DATA.length;

        initRangeOptions();
      }catch(e){
        console.error(e);
        alert("問題データの読み込みに失敗しました。\n\n" + e.message);
      }
    }

    // ---------------------------------------
    // イベント設定
    // ---------------------------------------
    $btnStart.onclick = () => {
      if(!DATA.length){
        alert("まだ CSV データが読み込まれていません。\nCSV_BASE64 に base64 文字列を貼り付けたうえで再度お試しください。");
        return;
      }

      // 範囲セレクトから範囲を反映
      if($rangeSelect && $rangeSelect.value){
        const [s,e] = $rangeSelect.value.split("-");
        const n = DATA.length;
        rangeStartId = parseInt(s || "1", 10);
        rangeEndId   = parseInt(e || String(n), 10);
      }else{
        rangeStartId = 1;
        rangeEndId   = DATA.length;
      }
      updateCurrentRangeLabel();

      // 復習用履歴はロード（wrongOnly 用）
      loadHistory();

      // 毎回「今回のセッションの回答」はリセット
      sessionAnswered = {};
      scoreOk = 0;
      scoreNg = 0;
      $ok.textContent = "0";
      $ng.textContent = "0";

      buildOrder($optWrongOnly.checked);
      if(order.length === 0){
        alert("出題できる問題がありません。");
        return;
      }
      $setup.style.display = 'none';
      $quiz.style.display = 'block';
      render();
    };

    $btnExit.onclick = () => {
      $quiz.style.display = 'none';
      $setup.style.display = 'block';
    };

    $btnTrue.onclick = () => grade(true);
    $btnFalse.onclick = () => grade(false);
    $btnNext.onclick = next;
    $btnPrev.onclick = prev;

    // ジャンプセレクトで範囲内の任意の問題に飛ぶ
    if($jumpSelect){
      $jumpSelect.addEventListener('change', () => {
        const v = $jumpSelect.value;
        const idx = parseInt(v, 10);
        if(!isNaN(idx) && idx >= 0 && idx < order.length){
          cursor = idx;
          render();
        }
      });
    }

    $btnMarkWrong.onclick = () => {
      const item = currentItem();
      if(!item) return;
      if(wrongMarked.has(item.id)){
        wrongMarked.delete(item.id);
      }else{
        wrongMarked.add(item.id);
      }
      $btnMarkWrong.classList.toggle('marked', wrongMarked.has(item.id));
      saveHistory();
    };

    $btnClear.onclick = () => {
      if(confirm('履歴と「間違えた扱い」をすべて消去しますか？')){
        historyAnswered = {};
        sessionAnswered = {};
        wrongMarked = new Set();
        saveHistory();
        resetScore();
        alert('消去しました');
      }
    };

    // 範囲セレクトが変わったらラベルだけ先に更新（開始時に反映）
    if($rangeSelect){
      $rangeSelect.addEventListener('change', () => {
        const [s,e] = $rangeSelect.value.split("-");
        const n = DATA.length || 1;
        rangeStartId = parseInt(s || "1", 10);
        rangeEndId   = parseInt(e || String(n), 10);
        updateCurrentRangeLabel();
      });
    }

    window.addEventListener('load', () => {
      try{
        initDataFromCsv();
      }catch(e){
        console.error(e);
      }
      loadHistory();
      $len.textContent = DATA.length || 0;
    });
  </script>
</body>
</html>
